[project]
name = "cyberbrief-backend"
version = "0.1.0"
description = "CyberBrief API: source-linked case packets for suspected UPI scams (hackathon prototype, fictional data only)"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy>=2",
  "alembic",
  "httpx",
  "pillow",
  "jinja2",
  "python-multipart",
  "langgraph",
  "langgraph-checkpoint-sqlite",
]

[project.optional-dependencies]
# only needed to (re)generate synthetic fixtures; not part of the runtime image
fixtures = ["pyttsx3", "soundfile", "scipy", "numpy"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "anyio", "ruff"]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501", "UP037"]  # asserts are fine in tests; line length is cosmetic; keep quoted forward refs for SQLAlchemy
